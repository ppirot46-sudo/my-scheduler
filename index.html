<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Scheduler & Habit Tracker</title>
  
  <!-- 모바일 PWA 및 웹앱 바로가기 설정 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="스케줄러">
  <meta name="theme-color" content="#ffffff">
  
  <!-- 파비콘 및 아이콘 지정 -->
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/ppirot46-sudo/my-scheduler/main/icon.png">
  <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/ppirot46-sudo/my-scheduler/main/icon.png">

  <!-- PWA Manifest 내장 -->
  <link rel="manifest" href="data:application/manifest+json;utf8,%7B%22name%22%3A%22Scheduler%20%26%20Habit%20Tracker%22%2C%22short_name%22%3A%22스케줄러%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23ffffff%22%2C%22theme_color%22%3A%22%23000000%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22https%3A%2F%2Fraw.githubusercontent.com%2Fppirot46-sudo%2Fmy-scheduler%2Fmain%2Ficon.png%22%2C%22sizes%22%3A%22512x512%22%2C%22type%22%3A%22image%2Fpng%22%7D%5D%7D">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #ffffff;
      -webkit-tap-highlight-color: transparent;
    }
    
    .pb-safe {
      padding-bottom: env(safe-area-inset-bottom, 16px);
    }
    .content-bottom-space {
      padding-bottom: calc(5rem + env(safe-area-inset-bottom, 0px));
    }
  </style>
</head>
<body class="bg-white min-h-screen">

  <div id="root" class="w-full h-full bg-white overflow-hidden"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- 계정별 localStorage 저장 Custom Hook ---
    function useAccountLocalStorage(account, key, initialValue) {
      const fullKey = `app_${account}__${key}`;
      const legacyKey = `app_${key}`;

      const [storedValue, setStoredValue] = useState(() => {
        try {
          const item = window.localStorage.getItem(fullKey);
          if (item !== null) return JSON.parse(item);
          if (account === '기본 계정') {
            const legacyItem = window.localStorage.getItem(legacyKey);
            if (legacyItem !== null) return JSON.parse(legacyItem);
          }
          return initialValue;
        } catch (error) {
          return initialValue;
        }
      });

      useEffect(() => {
        try {
          window.localStorage.setItem(fullKey, JSON.stringify(storedValue));
        } catch (error) {}
      }, [fullKey, storedValue]);

      return [storedValue, setStoredValue];
    }

    function useLocalStorage(key, initialValue) {
      const [storedValue, setStoredValue] = useState(() => {
        try {
          const item = window.localStorage.getItem(key);
          return item !== null ? JSON.parse(item) : initialValue;
        } catch (error) {
          return initialValue;
        }
      });

      useEffect(() => {
        try {
          window.localStorage.setItem(key, JSON.stringify(storedValue));
        } catch (error) {}
      }, [key, storedValue]);

      return [storedValue, setStoredValue];
    }

    // 아이콘 컴포넌트
    const CalendarIcon = ({ size = 20 }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
    );
    const ListTodoIcon = ({ size = 20 }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="5" width="6" height="6" rx="1"></rect><path d="m3 17 2 2 4-4"></path><path d="M13 6h8"></path><path d="M13 12h8"></path><path d="M13 18h8"></path></svg>
    );
    const CircleIcon = ({ size = 20 }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="8"></circle></svg>
    );
    const SettingsIcon = ({ size = 18 }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
    );
    const ChevronLeftIcon = ({ size = 20 }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
    );

    // --- 스와이프, 더블클릭 수정 및 길게 눌러 이동 지원 할 일 컴포넌트 ---
    const SwipeableTask = ({
      task,
      time,
      onToggleComplete,
      onUpdateText,
      onDelete,
      onDelay,
      themeColor,
      onSelectSlot,
      onOpenMoveModal
    }) => {
      const [offsetX, setOffsetX] = useState(0);
      const [isEditing, setIsEditing] = useState(false);
      const [editText, setEditText] = useState(task.text);

      const isPointerDownRef = useRef(false);
      const startX = useRef(0);
      const startY = useRef(0);
      const lastTapTime = useRef(0);
      const singleTapTimer = useRef(null);
      const longPressTimer = useRef(null);
      const isLongPressed = useRef(false);

      const clearLongPress = () => {
        if (longPressTimer.current) {
          clearTimeout(longPressTimer.current);
          longPressTimer.current = null;
        }
      };

      const clearSingleTapTimer = () => {
        if (singleTapTimer.current) {
          clearTimeout(singleTapTimer.current);
          singleTapTimer.current = null;
        }
      };

      const handlePointerDown = (e) => {
        if (isEditing) return;
        if (e.pointerType === 'touch') return;

        isPointerDownRef.current = true;
        isLongPressed.current = false;
        startX.current = e.clientX;
        startY.current = e.clientY;

        longPressTimer.current = setTimeout(() => {
          isLongPressed.current = true;
          if (navigator.vibrate) navigator.vibrate(50);
          onOpenMoveModal(task, time);
        }, 500);
      };

      const handlePointerMove = (e) => {
        if (!isPointerDownRef.current || isEditing) return;

        const diffX = e.clientX - startX.current;
        const diffY = e.clientY - startY.current;

        if (Math.hypot(diffX, diffY) > 8) {
          clearLongPress();
          if (Math.abs(diffX) > Math.abs(diffY)) {
            if (diffX > 0) setOffsetX(Math.min(diffX, 100));
            else setOffsetX(Math.max(diffX, -100));
          }
        }
      };

      const handlePointerUp = (e) => {
        if (e.pointerType === 'touch') return;
        clearLongPress();
        if (!isPointerDownRef.current) return;
        isPointerDownRef.current = false;

        if (isLongPressed.current) return;

        const distMoved = Math.hypot(e.clientX - startX.current, e.clientY - startY.current);

        if (distMoved < 8) {
          const now = Date.now();
          if (now - lastTapTime.current < 280) {
            clearSingleTapTimer();
            setIsEditing(true);
            lastTapTime.current = 0;
            return;
          }
          lastTapTime.current = now;
          clearSingleTapTimer();
          singleTapTimer.current = setTimeout(() => {
            onSelectSlot();
          }, 280);
        }

        if (offsetX > 50) {
          onToggleComplete();
        } else if (offsetX < -50) {
          onDelay();
        }
        setOffsetX(0);
      };

      const handleTouchStart = (e) => {
        if (isEditing) return;
        isPointerDownRef.current = true;
        isLongPressed.current = false;

        const touch = e.touches[0];
        if (touch) {
          startX.current = touch.clientX;
          startY.current = touch.clientY;
        }

        clearLongPress();
        longPressTimer.current = setTimeout(() => {
          isLongPressed.current = true;
          if (navigator.vibrate) navigator.vibrate(50);
          onOpenMoveModal(task, time);
        }, 500);
      };

      const handleTouchMove = (e) => {
        if (!isPointerDownRef.current || isEditing) return;
        const touch = e.touches[0];
        if (!touch) return;

        const diffX = touch.clientX - startX.current;
        const diffY = touch.clientY - startY.current;

        if (Math.hypot(diffX, diffY) > 8) {
          clearLongPress();
          if (Math.abs(diffX) > Math.abs(diffY)) {
            if (diffX > 0) setOffsetX(Math.min(diffX, 100));
            else setOffsetX(Math.max(diffX, -100));
          }
        }
      };

      const handleTouchEnd = (e) => {
        clearLongPress();
        if (!isPointerDownRef.current) return;
        isPointerDownRef.current = false;

        if (isLongPressed.current) return;

        const now = Date.now();
        const timeDiff = now - lastTapTime.current;

        if (timeDiff > 0 && timeDiff < 280) {
          clearSingleTapTimer();
          setIsEditing(true);
          lastTapTime.current = 0;
          if (e.cancelable) e.preventDefault();
          e.stopPropagation();
        } else {
          lastTapTime.current = now;
          clearSingleTapTimer();
          singleTapTimer.current = setTimeout(() => {
            onSelectSlot();
          }, 280);
        }

        if (offsetX > 50) {
          onToggleComplete();
        } else if (offsetX < -50) {
          onDelay();
        }
        setOffsetX(0);
      };

      const handleFinishEdit = () => {
        setIsEditing(false);
        const trimmed = editText.trim();
        if (!trimmed) {
          onDelete();
        } else {
          onUpdateText(trimmed);
        }
      };

      const getTaskTextStyle = () => {
        if (task.delayed) return 'line-through text-gray-400';
        if (task.completed) return 'line-through text-gray-400';
        return 'text-gray-800';
      };

      if (isEditing) {
        return (
          <div className="w-full my-0.5" onClick={(e) => e.stopPropagation()}>
            <input
              type="text"
              autoFocus
              value={editText}
              onChange={(e) => setEditText(e.target.value)}
              onKeyDown={(e) => {
                if (e.key === 'Enter') handleFinishEdit();
              }}
              onBlur={handleFinishEdit}
              className="w-full bg-gray-50 border border-gray-300 rounded px-2 py-0.5 outline-none text-xs text-black"
            />
          </div>
        );
      }

      return (
        <div className="relative overflow-hidden w-full mb-0.5 flex items-center select-none">
          <div
            onPointerDown={handlePointerDown}
            onPointerMove={handlePointerMove}
            onPointerUp={handlePointerUp}
            onPointerCancel={handlePointerUp}
            onTouchStart={handleTouchStart}
            onTouchMove={handleTouchMove}
            onTouchEnd={handleTouchEnd}
            style={{
              transform: `translateX(${offsetX}px)`,
              transition: isPointerDownRef.current ? 'none' : 'transform 0.2s ease-out'
            }}
            className="relative z-10 w-full py-0.5 px-1.5 touch-pan-y cursor-pointer bg-white flex items-center text-xs leading-tight rounded"
          >
            {task.delayed && (
              <span
                className="w-1.5 h-1.5 rounded-full inline-block mr-1.5 shrink-0"
                style={{ backgroundColor: themeColor || '#000000' }}
              />
            )}
            <span className={getTaskTextStyle()}>{task.text}</span>
          </div>
        </div>
      );
    };

    // --- 리스트업 내 단일 아이템 컴포넌트 ---
    const ListupItem = ({ item, onUpdateText, onDelete }) => {
      const [isEditing, setIsEditing] = useState(false);
      const [editText, setEditText] = useState(item.text);
      const lastTapTime = useRef(0);

      const handleTouchEnd = (e) => {
        const now = Date.now();
        if (now - lastTapTime.current < 280) {
          setIsEditing(true);
          lastTapTime.current = 0;
          if (e.cancelable) e.preventDefault();
        } else {
          lastTapTime.current = now;
        }
      };

      const handleFinish = () => {
        setIsEditing(false);
        const trimmed = editText.trim();
        if (!trimmed) {
          onDelete(item.id);
        } else {
          onUpdateText(item.id, trimmed);
        }
      };

      if (isEditing) {
        return (
          <div className="w-full my-0.5">
            <input
              type="text"
              autoFocus
              value={editText}
              onChange={(e) => setEditText(e.target.value)}
              onKeyDown={(e) => {
                if (e.key === 'Enter') handleFinish();
              }}
              onBlur={handleFinish}
              className="w-full bg-gray-50 border border-gray-300 rounded px-2 py-0.5 outline-none text-xs text-black"
            />
          </div>
        );
      }

      return (
        <div
          onTouchEnd={handleTouchEnd}
          onClick={() => {
            const now = Date.now();
            if (now - lastTapTime.current < 280) {
              setIsEditing(true);
            }
            lastTapTime.current = now;
          }}
          className="w-full py-0.5 px-1.5 my-0.5 text-xs text-gray-800 leading-tight rounded bg-white cursor-pointer select-none"
        >
          {item.text}
        </div>
      );
    };

    // --- 1. 일간 스케줄러 컴포넌트 ---
    function DailyScheduler({
      themeColor,
      dailyTasks,
      setDailyTasks,
      delayedTasks,
      setDelayedTasks,
      listupTasks,
      setListupTasks,
      onOpenSettings,
      startHour,
      endHour,
      selectedDateObj,
      setSelectedDateObj,
      activeTimes,
      setActiveTimes
    }) {
      const [isDelayOpen, setIsDelayOpen] = useState(false);
      const [handleOffsetY, setHandleOffsetY] = useState(0);
      const [moveModalData, setMoveModalData] = useState(null);

      // 스와이프 리스트업 서랍 관련 상태
      const [isListupOpen, setIsListupOpen] = useState(false);
      const [newListupText, setNewListupText] = useState('');
      const listupTouchStartX = useRef(0);
      const listupTouchStartY = useRef(0);

      const times = [];
      for (let h = startHour; h <= endHour; h++) {
        let displayHour = h > 24 ? h - 24 : h;
        times.push(displayHour);
      }

      const [visibleInputTime, setVisibleInputTime] = useState(null);
      const [inputValue, setInputValue] = useState('');

      const dateContainerRef = useRef(null);
      const activeDateRef = useRef(null);
      const inputRef = useRef(null);
      const listupInputRef = useRef(null);

      const datesList = useRef([]);
      if (datesList.current.length === 0) {
        const today = new Date();
        const temp = [];
        for (let i = -45; i <= 45; i++) {
          const d = new Date(today.getFullYear(), today.getMonth(), today.getDate() + i);
          temp.push(d);
        }
        datesList.current = temp;
      }

      const getDateKey = (dateObj) => {
        const y = dateObj.getFullYear();
        const m = String(dateObj.getMonth() + 1).padStart(2, '0');
        const d = String(dateObj.getDate()).padStart(2, '0');
        return `${y}-${m}-${d}`;
      };

      const goToToday = () => {
        const today = new Date();
        const match = datesList.current.find(d => d.toDateString() === today.toDateString());
        if (match) {
          setSelectedDateObj(match);
        } else {
          setSelectedDateObj(today);
        }
      };

      useEffect(() => {
        setVisibleInputTime(null);
        setInputValue('');
        const dateKey = getDateKey(selectedDateObj);
        const currentDayTasks = dailyTasks[dateKey] || {};
        const autoActive = {};

        Object.keys(currentDayTasks).forEach(timeStr => {
          if (currentDayTasks[timeStr] && currentDayTasks[timeStr].length > 0) {
            autoActive[timeStr] = true;
          }
        });

        setActiveTimes(autoActive);
      }, [selectedDateObj]);

      useEffect(() => {
        if (visibleInputTime !== null) {
          const timer = setTimeout(() => {
            if (inputRef.current) {
              inputRef.current.focus();
            }
          }, 50);
          return () => clearTimeout(timer);
        }
      }, [visibleInputTime]);

      useEffect(() => {
        if (activeDateRef.current && dateContainerRef.current) {
          const element = activeDateRef.current;
          dateContainerRef.current.scrollTo({
            left: element.offsetLeft - 48 + (element.offsetWidth / 2),
            behavior: 'smooth'
          });
        }
      }, [selectedDateObj]);

      const handleGlobalTouchStart = (e) => {
        const touch = e.touches[0];
        listupTouchStartX.current = touch.clientX;
        listupTouchStartY.current = touch.clientY;
      };

      const handleGlobalTouchEnd = (e) => {
        const touch = e.changedTouches[0];
        const startX = listupTouchStartX.current;
        const startY = listupTouchStartY.current;
        const diffX = touch.clientX - startX;
        const diffY = touch.clientY - startY;
        const screenWidth = window.innerWidth;
        const screenHeight = window.innerHeight;

        const topBoundary = 112; 
        const bottomBoundary = screenHeight - 65;

        if (startY > topBoundary && startY < bottomBoundary) {
          if (Math.abs(diffX) > Math.abs(diffY) * 1.5) {
            if (diffX < -50 && startX > screenWidth * 0.65) {
              setIsListupOpen(true);
            } else if (diffX > 50 && isListupOpen) {
              setIsListupOpen(false);
            }
          }
        }
      };

      const dateKey = getDateKey(selectedDateObj);
      const currentDayTasks = dailyTasks[dateKey] || {};
      const allTasks = Object.values(currentDayTasks).flat();
      const totalCount = allTasks.length;
      const completedCount = allTasks.filter(t => t.completed).length;
      const progressPercent = totalCount > 0 ? Math.round((completedCount / totalCount) * 100) : 0;

      const toggleTimeActive = (time) => {
        const nextActiveState = !activeTimes[time];
        setActiveTimes(prev => ({ ...prev, [time]: nextActiveState }));

        if (nextActiveState) {
          setVisibleInputTime(time);
          setInputValue('');
        } else {
          if (visibleInputTime === time) {
            setVisibleInputTime(null);
            setInputValue('');
          }
        }
      };

      const handleInputBlur = (time) => {
        if (!inputValue.trim()) {
          const timeTasks = currentDayTasks[time] || [];
          if (timeTasks.length === 0) {
            setActiveTimes(prev => ({ ...prev, [time]: false }));
          }
          if (visibleInputTime === time) {
            setVisibleInputTime(null);
          }
        }
      };

      const handleAddTaskAndContinue = (time) => {
        if (!inputValue.trim()) return;

        const textToSave = inputValue.trim();
        const curKey = getDateKey(selectedDateObj);
        setDailyTasks(prev => {
          const dayData = prev[curKey] || {};
          const timeData = dayData[time] || [];
          return {
            ...prev,
            [curKey]: {
              ...dayData,
              [time]: [...timeData, { id: Date.now().toString(), text: textToSave, completed: false, delayed: false }]
            }
          };
        });

        setInputValue('');
        setVisibleInputTime(time);
        setActiveTimes(prev => ({ ...prev, [time]: true }));

        setTimeout(() => {
          if (inputRef.current) {
            inputRef.current.focus();
          }
        }, 50);
      };

      const updateTaskText = (time, taskId, newText) => {
        const curKey = getDateKey(selectedDateObj);
        setDailyTasks(prev => {
          const dayData = prev[curKey] || {};
          const timeData = dayData[time] || [];
          return {
            ...prev,
            [curKey]: {
              ...dayData,
              [time]: timeData.map(t => t.id === taskId ? { ...t, text: newText } : t)
            }
          };
        });
      };

      const toggleTaskComplete = (time, taskId) => {
        const curKey = getDateKey(selectedDateObj);
        setDailyTasks(prev => {
          const dayData = prev[curKey] || {};
          const timeData = dayData[time] || [];
          return {
            ...prev,
            [curKey]: {
              ...dayData,
              [time]: timeData.map(t => t.id === taskId ? { ...t, completed: !t.completed, delayed: false } : t)
            }
          };
        });
      };

      const deleteTask = (time, taskId) => {
        const curKey = getDateKey(selectedDateObj);
        setDailyTasks(prev => {
          const dayData = prev[curKey] || {};
          const timeData = dayData[time] || [];
          const updatedTimeData = timeData.filter(t => t.id !== taskId);
          return {
            ...prev,
            [curKey]: {
              ...dayData,
              [time]: updatedTimeData
            }
          };
        });
      };

      const handleDelayTask = (time, task) => {
        const isCurrentlyDelayed = !!task.delayed;
        const curKey = getDateKey(selectedDateObj);

        setDailyTasks(prev => {
          const dayData = prev[curKey] || {};
          const timeData = dayData[time] || [];
          return {
            ...prev,
            [curKey]: {
              ...dayData,
              [time]: timeData.map(t =>
                t.id === task.id
                  ? { ...t, delayed: !isCurrentlyDelayed, completed: false }
                  : t
              )
            }
          };
        });

        if (isCurrentlyDelayed) {
          setDelayedTasks(prev => prev.filter(item => !(item.text === task.text && item.originDate === curKey)));
        } else {
          setDelayedTasks(prev => [{ id: Date.now().toString(), text: task.text, originDate: curKey }, ...prev]);
        }
      };

      const handleMoveTaskTime = (targetTime) => {
        if (!moveModalData) return;
        const { task, currentTime } = moveModalData;

        if (Number(currentTime) === Number(targetTime)) {
          setMoveModalData(null);
          return;
        }

        const curKey = getDateKey(selectedDateObj);
        setDailyTasks(prev => {
          const dayData = prev[curKey] || {};
          const currentList = dayData[currentTime] || [];
          const targetList = dayData[targetTime] || [];

          return {
            ...prev,
            [curKey]: {
              ...dayData,
              [currentTime]: currentList.filter(t => t.id !== task.id),
              [targetTime]: [...targetList, task]
            }
          };
        });

        setActiveTimes(prev => ({ ...prev, [targetTime]: true }));
        setMoveModalData(null);
      };

      const handleAddFromDelay = (delayItem) => {
        const activeTimeSlot = visibleInputTime || times[0];
        if (!activeTimes[activeTimeSlot]) {
          setActiveTimes(prev => ({ ...prev, [activeTimeSlot]: true }));
        }

        const curKey = getDateKey(selectedDateObj);
        setDailyTasks(prev => {
          const dayData = prev[curKey] || {};
          const timeData = dayData[activeTimeSlot] || [];
          return {
            ...prev,
            [curKey]: {
              ...dayData,
              [activeTimeSlot]: [...timeData, { id: Date.now().toString(), text: delayItem.text, completed: false, delayed: false }]
            }
          };
        });

        if (delayItem.originDate !== curKey) {
          setDelayedTasks(prev => prev.filter(item => item.id !== delayItem.id));
        }
      };

      const handleRemoveDelayItem = (delayId) => {
        setDelayedTasks(prev => prev.filter(item => item.id !== delayId));
      };

      const handleAddListupTask = () => {
        if (!newListupText.trim()) return;
        setListupTasks(prev => [...prev, { id: Date.now().toString(), text: newListupText.trim() }]);
        setNewListupText('');
        setTimeout(() => {
          if (listupInputRef.current) listupInputRef.current.focus();
        }, 50);
      };

      const handleUpdateListupText = (id, newText) => {
        setListupTasks(prev => prev.map(item => item.id === id ? { ...item, text: newText } : item));
      };

      const handleDeleteListupItem = (id) => {
        setListupTasks(prev => prev.filter(item => item.id !== id));
      };

      const glowStartY = useRef(0);
      const handleGlowPointerDown = (e) => {
        glowStartY.current = e.clientY;
        try { e.target.setPointerCapture(e.pointerId); } catch(err) {}
      };

      const handleGlowPointerMove = (e) => {
        if (!glowStartY.current) return;
        const diffY = e.clientY - glowStartY.current;
        if (diffY < 0) {
          setHandleOffsetY(diffY);
        }
      };

      const handleGlowPointerUp = (e) => {
        if (!glowStartY.current) return;
        const diffY = e.clientY - glowStartY.current;
        glowStartY.current = 0;
        setHandleOffsetY(0);
        try { e.target.releasePointerCapture(e.pointerId); } catch(err) {}

        if (diffY < -15) {
          setIsDelayOpen(true);
        }
      };

      const handleDrawerPointerDown = (e) => {
        glowStartY.current = e.clientY;
      };

      const handleDrawerPointerUp = (e) => {
        const diffY = e.clientY - glowStartY.current;
        if (diffY > 15 || Math.abs(diffY) <= 5) {
          setIsDelayOpen(false);
        }
      };

      const dateMonthStr = selectedDateObj.getMonth() + 1;
      const dateDayStr = selectedDateObj.getDate();
      const slashDateFormat = `${dateMonthStr}/${dateDayStr}`;

      return (
        <div
          onTouchStart={handleGlobalTouchStart}
          onTouchEnd={handleGlobalTouchEnd}
          className="flex flex-col h-full bg-white relative select-none overflow-hidden"
        >
          <style>{`.no-scrollbar::-webkit-scrollbar { display: none; } .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }`}</style>

          {/* 상단 헤더 바 */}
          <div className="w-full px-0 py-4 bg-white border-b border-gray-100 flex items-center justify-between z-30 shrink-0">
            <div className="w-[96px] flex justify-center items-center shrink-0">
              <button
                onClick={goToToday}
                className="text-2xl font-extrabold text-gray-800 hover:text-black active:scale-95 transition-transform cursor-pointer"
                title="오늘 날짜로 이동"
              >
                {dateMonthStr}
              </button>
            </div>
            <div className="flex items-center gap-1.5 pr-4">
              <span className="text-[10px] font-semibold text-gray-400">{progressPercent}%</span>
              <div className="w-16 bg-gray-100 h-1.5 rounded-full overflow-hidden">
                <div className="h-full transition-all duration-500 rounded-full" style={{ width: `${progressPercent}%`, backgroundColor: themeColor }} />
              </div>
              <button onClick={onOpenSettings} className="p-1 rounded-full hover:bg-gray-100 text-gray-400 transition-colors">
                <SettingsIcon size={16} />
              </button>
            </div>
          </div>

          {/* 날짜 선택 탭 */}
          <div
            ref={dateContainerRef}
            className="w-full bg-white border-b border-gray-100 h-14 flex items-center overflow-x-auto no-scrollbar relative z-20 shrink-0 touch-pan-x"
          >
            <div className="flex px-[48px] gap-8 min-w-max items-center h-full pr-[calc(100%-48px)]">
              {datesList.current.map((dObj, idx) => {
                const isActive = dObj.toDateString() === selectedDateObj.toDateString();
                return (
                  <button
                    key={idx}
                    ref={isActive ? activeDateRef : null}
                    onClick={() => setSelectedDateObj(dObj)}
                    className={`text-2xl font-extrabold transition-all duration-300 ${isActive ? '' : 'text-gray-300 hover:text-gray-400'}`}
                    style={{ color: isActive ? themeColor : undefined }}
                  >
                    {dObj.getDate()}
                  </button>
                );
              })}
            </div>
          </div>

          {/* 타임라인 영역 */}
          <div className="flex-1 overflow-y-auto w-full flex flex-col content-bottom-space">
            <div className="w-full flex flex-col pt-6 pb-40 relative">
              <div className="absolute top-0 bottom-0 left-[48px] w-[2px] -translate-x-1/2 z-0" style={{ backgroundColor: themeColor }} />

              {times.map((time, index) => {
                const isActive = activeTimes[time] || visibleInputTime === time;
                const timeTasks = currentDayTasks[time] || [];
                const hasTasks = timeTasks.length > 0;
                const isInputShow = visibleInputTime === time;

                return (
                  <div
                    key={index}
                    data-time-slot={time}
                    className={`relative flex items-start w-full transition-all duration-200 ${
                      isActive ? 'my-2 min-h-[2.5rem]' : 'my-0 min-h-[1.25rem]'
                    }`}
                  >
                    <div className="w-[96px] flex-shrink-0 flex justify-center items-center z-10 pt-0 relative bg-white">
                      <button
                        onClick={() => toggleTimeActive(time)}
                        className={`relative flex items-center justify-center transition-all duration-300 ease-out focus:outline-none ${
                          isActive
                            ? 'w-9 h-9 rounded-full text-white text-base shadow-md font-bold'
                            : hasTasks
                            ? 'bg-white px-2 py-0.5 text-xs font-extrabold'
                            : 'bg-white px-2 py-0.5 text-xs font-bold text-gray-500 hover:text-black'
                        }`}
                        style={{
                          backgroundColor: isActive ? themeColor : '#ffffff',
                          color: isActive ? '#ffffff' : (hasTasks ? themeColor : undefined)
                        }}
                      >
                        {time}
                      </button>
                    </div>

                    {isActive && (
                      <div
                        onClick={() => {
                          if (visibleInputTime !== time) {
                            setVisibleInputTime(time);
                          }
                        }}
                        className="flex-1 pr-4 z-20 flex flex-col min-w-0 pt-1 bg-white pl-2 gap-0.5 cursor-pointer min-h-[2rem]"
                      >
                        {timeTasks.map(task => (
                          <SwipeableTask
                            key={task.id}
                            task={task}
                            time={time}
                            themeColor={themeColor}
                            onToggleComplete={() => toggleTaskComplete(time, task.id)}
                            onUpdateText={(newText) => updateTaskText(time, task.id, newText)}
                            onDelete={() => deleteTask(time, task.id)}
                            onDelay={() => handleDelayTask(time, task)}
                            onSelectSlot={() => {
                              setVisibleInputTime(time);
                            }}
                            onOpenMoveModal={(task, currentTime) => {
                              setMoveModalData({ task, currentTime });
                            }}
                          />
                        ))}

                        {/* 입력 창 */}
                        {isInputShow && (
                          <div className="flex items-center border border-gray-200 rounded my-0.5 bg-gray-50">
                            <input
                              ref={inputRef}
                              type="text"
                              autoFocus
                              placeholder="할 일 입력..."
                              value={inputValue}
                              onChange={(e) => setInputValue(e.target.value)}
                              onPointerDown={(e) => e.stopPropagation()}
                              onBlur={() => handleInputBlur(time)}
                              onKeyDown={(e) => {
                                if (e.key === 'Enter') {
                                  e.preventDefault();
                                  handleAddTaskAndContinue(time);
                                }
                              }}
                              className="w-full bg-transparent px-2 py-0.5 outline-none text-xs text-black placeholder-gray-300"
                            />
                            <button
                              type="button"
                              onClick={() => handleAddTaskAndContinue(time)}
                              className="px-2 py-0.5 text-xs font-bold text-gray-500 hover:text-black shrink-0"
                            >
                              +
                            </button>
                          </div>
                        )}
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          </div>

          {/* 스와이프 리스트업 패널 */}
          {isListupOpen && (
            <div className="fixed inset-0 z-50 bg-black/20 flex justify-end items-start pt-16 pr-4">
              <div className="bg-white w-72 max-w-[80vw] h-[65vh] rounded-2xl shadow-2xl flex flex-col overflow-hidden border border-gray-100 animate-in fade-in duration-200">
                <div className="w-full px-5 py-4 flex items-center justify-between border-b border-gray-100 bg-white shrink-0">
                  <span className="text-2xl font-extrabold text-gray-800">
                    {slashDateFormat}
                  </span>
                  <button
                    onClick={() => setIsListupOpen(false)}
                    className="text-gray-400 hover:text-black text-sm font-bold p-1"
                    title="닫기"
                  >
                    ✕
                  </button>
                </div>

                <div className="flex-1 p-4 overflow-y-auto flex flex-col bg-white">
                  <div className="flex flex-col mb-1">
                    {listupTasks.map(item => (
                      <ListupItem
                        key={item.id}
                        item={item}
                        onUpdateText={handleUpdateListupText}
                        onDelete={handleDeleteListupItem}
                      />
                    ))}
                  </div>

                  <div className="flex items-center border border-gray-200 rounded my-0.5 bg-gray-50">
                    <input
                      ref={listupInputRef}
                      type="text"
                      placeholder="할 일 입력..."
                      value={newListupText}
                      onChange={(e) => setNewListupText(e.target.value)}
                      onKeyDown={(e) => {
                        if (e.key === 'Enter') {
                          e.preventDefault();
                          handleAddListupTask();
                        }
                      }}
                      className="w-full bg-transparent px-2 py-0.5 outline-none text-xs text-black placeholder-gray-300"
                    />
                    <button
                      type="button"
                      onClick={handleAddListupTask}
                      className="px-2 py-0.5 text-xs font-bold text-gray-500 hover:text-black shrink-0"
                    >
                      +
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* 시간 이동 모달 */}
          {moveModalData && (
            <div className="fixed inset-0 bg-black/40 flex justify-center items-center z-50 p-4" onClick={() => setMoveModalData(null)}>
              <div className="bg-white p-5 rounded-2xl shadow-xl w-72 flex flex-col gap-3" onClick={e => e.stopPropagation()}>
                <h3 className="font-bold text-gray-800 text-sm text-center">시간대 이동 선택</h3>
                <p className="text-xs text-gray-500 text-center font-medium truncate px-2">"{moveModalData.task.text}"</p>
                <div className="grid grid-cols-4 gap-2 max-h-56 overflow-y-auto p-1 border-t border-b border-gray-100 my-1">
                  {times.map(t => (
                    <button
                      key={t}
                      onClick={() => handleMoveTaskTime(t)}
                      className={`py-1.5 text-xs font-bold rounded-lg border transition-all ${
                        Number(moveModalData.currentTime) === Number(t)
                          ? 'border-black bg-black text-white'
                          : 'border-gray-200 bg-gray-50 text-gray-700 hover:bg-gray-100'
                      }`}
                    >
                      {t}시
                    </button>
                  ))}
                </div>
                <button
                  onClick={() => setMoveModalData(null)}
                  className="w-full py-1.5 text-xs font-bold text-gray-500 hover:text-black"
                >
                  취소
                </button>
              </div>
            </div>
          )}

          {/* Delay 항목 존재 시 스와이프 바 */}
          {delayedTasks.length > 0 && !isDelayOpen && (
            <div
              onPointerDown={handleGlowPointerDown}
              onPointerMove={handleGlowPointerMove}
              onPointerUp={handleGlowPointerUp}
              onPointerCancel={handleGlowPointerUp}
              style={{ transform: `translateY(${handleOffsetY}px)` }}
              className="fixed bottom-[calc(3.5rem+env(safe-area-inset-bottom,0px))] left-0 right-0 w-full z-40 flex items-center justify-center cursor-grab active:cursor-grabbing select-none touch-none py-1 bg-white/80 backdrop-blur border-t border-gray-100"
            >
              <div className="w-10 h-1 rounded-full bg-gray-300" />
            </div>
          )}

          {/* 펼쳐진 Delay 보관함 창 */}
          {isDelayOpen && (
            <div className="fixed bottom-[calc(3.5rem+env(safe-area-inset-bottom,0px))] left-0 right-0 w-full h-48 bg-white border-t border-gray-200 shadow-2xl z-40 transition-all duration-300 flex flex-col">
              <div
                onPointerDown={handleDrawerPointerDown}
                onPointerUp={handleDrawerPointerUp}
                className="w-full py-2 flex items-center justify-center cursor-pointer border-b border-gray-100 shrink-0 bg-white hover:bg-gray-50 transition-colors touch-none"
              >
                <div className="w-10 h-1 bg-gray-300 rounded-full" />
              </div>

              <div className="p-3 overflow-y-auto flex-1 flex flex-col gap-1 bg-white">
                {delayedTasks.length === 0 ? (
                  <p className="text-[11px] text-gray-400 text-center py-4">보관된 항목이 없습니다</p>
                ) : (
                  delayedTasks.map((item) => (
                    <div
                      key={item.id}
                      className="flex items-center justify-between py-1.5 px-2 border-b border-gray-50 last:border-none"
                    >
                      <span className="text-xs text-gray-700 truncate flex-1">{item.text}</span>
                      <div className="flex items-center gap-2 shrink-0 ml-2">
                        <button
                          onClick={() => handleAddFromDelay(item)}
                          className="text-xs font-bold text-gray-500 hover:text-black px-1"
                          title="현재 일자에 추가"
                        >
                          +
                        </button>
                        <button
                          onClick={() => handleRemoveDelayItem(item.id)}
                          className="text-xs text-gray-300 hover:text-red-500 px-1"
                        >
                          ✕
                        </button>
                      </div>
                    </div>
                  ))
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    // --- 2. 달력(월간) 스케줄러 컴포넌트 ---
    function CalendarScheduler({ themeColor, categories, setCategories, calendarEvents, setCalendarEvents, savedColors, calendarClickToken }) {
      const today = new Date();
      const currentYear = today.getFullYear();
      const currentMonthIndex = today.getMonth();

      const months = [];
      for (let i = -12; i <= 12; i++) {
        months.push(new Date(currentYear, currentMonthIndex + i, 1));
      }

      const monthRefs = useRef([]);
      const containerRef = useRef(null);

      const [modalInfo, setModalInfo] = useState({ show: false, dateKey: '', isAdding: false, editIndex: null });
      const [inputText, setInputText] = useState('');
      const [selectedCategoryId, setSelectedCategoryId] = useState(categories[0]?.id || null);
      const [selectedColor, setSelectedColor] = useState(categories[0]?.color || themeColor);

      const [newCatName, setNewCatName] = useState('');
      const [newCatColor, setNewCatColor] = useState(savedColors && savedColors.length > 0 ? savedColors[0] : themeColor);
      const [editingCatId, setEditingCatId] = useState(null);

      const scrollToCurrentMonth = () => {
        const el = monthRefs.current[12];
        const container = containerRef.current;
        if (el && container) {
          container.scrollTo({ top: el.offsetTop, behavior: 'smooth' });
        }
      };

      useEffect(() => {
        scrollToCurrentMonth();
        const timer = setTimeout(scrollToCurrentMonth, 100);
        return () => clearTimeout(timer);
      }, []);

      useEffect(() => {
        if (calendarClickToken > 0) {
          scrollToCurrentMonth();
        }
      }, [calendarClickToken]);

      useEffect(() => {
        if (savedColors && savedColors.length > 0) {
          setNewCatColor(savedColors[0]);
        }
      }, [savedColors]);

      const handleOpenDayModal = (dateKey) => {
        const events = calendarEvents[dateKey] || [];
        const initCat = categories[0];
        const defaultCatId = initCat ? initCat.id : null;
        const defaultColor = initCat ? initCat.color : themeColor;

        if (events.length === 0) {
          setModalInfo({ show: true, dateKey, isAdding: true, editIndex: null });
          setInputText('');
          setSelectedCategoryId(defaultCatId);
          setSelectedColor(defaultColor);
        } else {
          setModalInfo({ show: true, dateKey, isAdding: false, editIndex: null });
          setInputText('');
          setSelectedCategoryId(defaultCatId);
          setSelectedColor(defaultColor);
        }
      };

      const handleSaveEvent = () => {
        if (!inputText.trim()) return;

        setCalendarEvents(prev => {
          const dayEvents = [...(prev[modalInfo.dateKey] || [])];
          if (modalInfo.editIndex !== null) {
            dayEvents[modalInfo.editIndex] = {
              text: inputText.trim(),
              color: selectedColor,
              categoryId: selectedCategoryId
            };
          } else {
            dayEvents.push({
              text: inputText.trim(),
              color: selectedColor,
              categoryId: selectedCategoryId
            });
          }
          return { ...prev, [modalInfo.dateKey]: dayEvents };
        });

        setInputText('');
        setModalInfo(prev => ({ ...prev, isAdding: false, editIndex: null }));
      };

      const handleDeleteEvent = (index, e) => {
        if (e) e.stopPropagation();
        setCalendarEvents(prev => {
          const dayEvents = [...(prev[modalInfo.dateKey] || [])];
          dayEvents.splice(index, 1);
          return { ...prev, [modalInfo.dateKey]: dayEvents };
        });
      };

      const handleStartEdit = (index, ev) => {
        setInputText(ev.text);
        setSelectedCategoryId(ev.categoryId || null);
        setSelectedColor(ev.color);
        setModalInfo(prev => ({ ...prev, isAdding: true, editIndex: index }));
      };

      const handleSaveCategory = () => {
        if (!newCatName.trim()) return;

        if (editingCatId) {
          setCategories(categories.map(c => c.id === editingCatId ? { ...c, name: newCatName.trim(), color: newCatColor } : c));

          setCalendarEvents(prev => {
            const updated = { ...prev };
            Object.keys(updated).forEach(dKey => {
              updated[dKey] = updated[dKey].map(ev => {
                if (ev.categoryId === editingCatId) {
                  return { ...ev, color: newCatColor };
                }
                return ev;
              });
            });
            return updated;
          });

          if (selectedCategoryId === editingCatId) {
            setSelectedColor(newCatColor);
          }
          setEditingCatId(null);
        } else {
          const newCat = { id: Date.now().toString(), name: newCatName.trim(), color: newCatColor };
          setCategories([...categories, newCat]);
          setSelectedCategoryId(newCat.id);
          setSelectedColor(newCat.color);
        }

        setNewCatName('');
      };

      const handleStartEditCategory = (cat, e) => {
        if (e) e.stopPropagation();
        setEditingCatId(cat.id);
        setNewCatName(cat.name);
        setNewCatColor(cat.color);
      };

      const handleCancelEditCategory = () => {
        setEditingCatId(null);
        setNewCatName('');
        setNewCatColor(savedColors && savedColors.length > 0 ? savedColors[0] : themeColor);
      };

      const handleDeleteCategory = (id, e) => {
        if (e) e.stopPropagation();
        setCategories(categories.filter(c => c.id !== id));
        if (selectedCategoryId === id) {
          const remain = categories.filter(c => c.id !== id);
          if (remain.length > 0) {
            setSelectedCategoryId(remain[0].id);
            setSelectedColor(remain[0].color);
          } else {
            setSelectedCategoryId(null);
            setSelectedColor(themeColor);
          }
        }
        if (editingCatId === id) {
          handleCancelEditCategory();
        }
      };

      const getDaysInMonth = (year, month) => {
        const date = new Date(year, month, 1);
        const days = [];
        for (let i = 0; i < date.getDay(); i++) days.push(null);
        while (date.getMonth() === month) { days.push(new Date(date)); date.setDate(date.getDate() + 1); }
        return days;
      };

      const currentModalEvents = modalInfo.dateKey ? (calendarEvents[modalInfo.dateKey] || []) : [];

      return (
        <div ref={containerRef} className="h-full overflow-y-auto bg-gray-50 content-bottom-space">
          {months.map((monthDate, idx) => {
            const year = monthDate.getFullYear();
            const month = monthDate.getMonth();
            const days = getDaysInMonth(year, month);
            return (
              <div key={idx} ref={el => monthRefs.current[idx] = el} className="bg-white mb-3 border-b px-2 py-3 shadow-sm">
                <h2 className="text-2xl font-extrabold mb-2 pl-1" style={{ color: themeColor }}>
                  {month + 1}월 <span className="text-gray-400 text-base font-medium ml-1">{year}</span>
                </h2>
                <div className="grid grid-cols-7 text-center text-xs font-semibold text-gray-400 mb-1.5">
                  <div className="text-red-400">일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div className="text-blue-400">토</div>
                </div>
                <div className="grid grid-cols-7 gap-x-[1px] gap-y-[1px]">
                  {days.map((dayDate, dayIdx) => {
                    if (!dayDate) return <div key={`empty-${dayIdx}`} className="min-h-[72px]"></div>;
                    const dateKey = `${year}-${String(month+1).padStart(2, '0')}-${String(dayDate.getDate()).padStart(2, '0')}`;
                    const events = calendarEvents[dateKey] || [];
                    const isToday = today.toDateString() === dayDate.toDateString();
                    return (
                      <div key={dateKey} onClick={() => handleOpenDayModal(dateKey)} className="min-h-[72px] rounded-sm p-0.5 flex flex-col items-center cursor-pointer hover:bg-gray-50 active:bg-gray-100 transition-colors">
                        <span className={`text-xs font-semibold w-5 h-5 flex justify-center items-center rounded-full ${isToday ? 'text-white font-bold' : 'text-gray-800'}`} style={{ backgroundColor: isToday ? themeColor : 'transparent' }}>
                          {dayDate.getDate()}
                        </span>
                        <div className="w-full mt-0.5 flex flex-col gap-0.5">
                          {events.map((ev, evIdx) => (
                            <div key={evIdx} className="text-[9px] leading-tight truncate rounded-sm px-1 py-[1px] w-full text-white font-medium" style={{ backgroundColor: ev.color }}>
                              {ev.text}
                            </div>
                          ))}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            );
          })}

          {/* 일정 모달 */}
          {modalInfo.show && (
            <div className="fixed inset-0 bg-black/40 flex justify-center items-center z-50 p-4" onClick={() => setModalInfo({ show: false, dateKey: '', isAdding: false, editIndex: null })}>
              <div className="bg-white p-5 rounded-none shadow-xl w-80 max-h-[80vh] flex flex-col relative border border-gray-200" onClick={e => e.stopPropagation()}>
                
                <div className="flex items-center justify-between border-b border-gray-100 pb-2.5 mb-3">
                  <h3 className="font-bold text-gray-800 text-sm">{modalInfo.dateKey} 일정</h3>
                  <button onClick={() => setModalInfo({ show: false, dateKey: '', isAdding: false, editIndex: null })} className="text-gray-400 hover:text-black text-xs font-bold p-1">✕</button>
                </div>

                {modalInfo.isAdding ? (
                  <div className="flex flex-col gap-3">
                    <input
                      type="text"
                      autoFocus
                      placeholder="일정 내용을 입력하세요"
                      value={inputText}
                      onChange={e => setInputText(e.target.value)}
                      onKeyDown={e => e.key === 'Enter' && handleSaveEvent()}
                      className="bg-gray-50 border border-gray-200 rounded-none px-3 py-2 text-xs outline-none w-full"
                    />

                    <div>
                      <p className="text-[11px] font-bold text-gray-400 mb-1.5">카테고리 선택</p>
                      <div className="flex flex-wrap gap-1.5 max-h-28 overflow-y-auto pr-0.5">
                        {categories.map(cat => {
                          const isSelected = selectedCategoryId === cat.id;
                          return (
                            <div
                              key={cat.id}
                              onClick={() => {
                                setSelectedCategoryId(cat.id);
                                setSelectedColor(cat.color);
                              }}
                              className={`flex items-center gap-1 px-2 py-1 rounded-none text-[10px] text-white cursor-pointer transition-all ${isSelected ? 'ring-2 ring-black font-bold scale-105 z-10' : 'opacity-85 hover:opacity-100'}`}
                              style={{ backgroundColor: cat.color }}
                            >
                              <span>{cat.name}</span>
                              <div className="flex items-center gap-0.5 ml-1">
                                <button
                                  type="button"
                                  onClick={(e) => handleStartEditCategory(cat, e)}
                                  className="text-[9px] hover:text-black/80 font-bold px-0.5 opacity-80 hover:opacity-100"
                                  title="카테고리 편집"
                                >
                                  ✏️
                                </button>
                                <button
                                  type="button"
                                  onClick={(e) => handleDeleteCategory(cat.id, e)}
                                  className="text-[10px] hover:text-black font-bold px-0.5 opacity-80 hover:opacity-100"
                                  title="삭제"
                                >
                                  ✕
                                </button>
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    </div>

                    <div className="border-t border-gray-100 pt-2.5">
                      <div className="flex justify-between items-center mb-1">
                        <p className="text-[10px] font-bold text-gray-400">
                          {editingCatId ? '카테고리 편집 (색상 일괄 변경)' : '카테고리 추가'}
                        </p>
                        {editingCatId && (
                          <button type="button" onClick={handleCancelEditCategory} className="text-[9px] text-gray-400 hover:text-black underline">
                            취소
                          </button>
                        )}
                      </div>
                      <div className="flex gap-1 mb-1.5">
                        <input
                          type="text"
                          placeholder={editingCatId ? "변경할 카테고리명" : "새 카테고리"}
                          value={newCatName}
                          onChange={e => setNewCatName(e.target.value)}
                          className="flex-1 bg-gray-50 border border-gray-200 rounded-none px-2 py-1 text-[10px] outline-none"
                        />
                        <button type="button" onClick={handleSaveCategory} className="bg-gray-800 text-white text-[10px] px-2 py-1 font-bold">
                          {editingCatId ? '수정' : '추가'}
                        </button>
                      </div>
                      <div className="flex flex-wrap gap-1.5 mt-1">
                        {(savedColors || [themeColor]).map(c => (
                          <button
                            key={c}
                            type="button"
                            onClick={() => setNewCatColor(c)}
                            className={`w-4 h-4 rounded-full transition-transform ${newCatColor === c ? 'ring-2 ring-black scale-110' : 'opacity-70'}`}
                            style={{ backgroundColor: c }}
                          />
                        ))}
                      </div>
                    </div>

                    <div className="flex justify-end gap-2 border-t border-gray-100 pt-3 mt-1">
                      <button type="button" onClick={() => setModalInfo(prev => ({ ...prev, isAdding: false, editIndex: null }))} className="text-xs text-gray-500 font-medium px-3 py-1">취소</button>
                      <button type="button" onClick={handleSaveEvent} className="text-xs font-bold px-4 py-1 text-white bg-black">
                        {modalInfo.editIndex !== null ? '수정 저장' : '추가'}
                      </button>
                    </div>
                  </div>
                ) : (
                  <div className="flex flex-col flex-1 min-h-[120px]">
                    <div className="flex-1 overflow-y-auto max-h-56 flex flex-col gap-1.5 pr-1">
                      {currentModalEvents.length === 0 ? (
                        <p className="text-xs text-gray-400 text-center py-8">등록된 일정이 없습니다.</p>
                      ) : (
                        currentModalEvents.map((ev, idx) => (
                          <div
                            key={idx}
                            onClick={() => handleStartEdit(idx, ev)}
                            className="flex items-center justify-between p-2 rounded-none cursor-pointer hover:opacity-90 transition-opacity text-white text-xs"
                            style={{ backgroundColor: ev.color }}
                          >
                            <span className="truncate flex-1 font-medium mr-2">{ev.text}</span>
                            <button
                              type="button"
                              onClick={(e) => handleDeleteEvent(idx, e)}
                              className="text-white/80 hover:text-white font-bold px-1 text-xs"
                              title="삭제"
                            >
                              ✕
                            </button>
                          </div>
                        ))
                      )}
                    </div>

                    <div className="flex justify-end pt-3 mt-auto border-t border-gray-100">
                      <button
                        type="button"
                        onClick={() => {
                          setInputText('');
                          const firstCat = categories[0];
                          setSelectedCategoryId(firstCat ? firstCat.id : null);
                          setSelectedColor(firstCat ? firstCat.color : themeColor);
                          setModalInfo(prev => ({ ...prev, isAdding: true, editIndex: null }));
                        }}
                        className="w-8 h-8 rounded-full bg-black text-white font-bold text-lg flex items-center justify-center shadow-md active:scale-95 transition-transform"
                        title="일정 추가"
                      >
                        +
                      </button>
                    </div>
                  </div>
                )}

              </div>
            </div>
          )}
        </div>
      );
    }

    // --- 3. 해빗 트래커 컴포넌트 ---
    function HabitTracker({ themeColor, habits, setHabits }) {
      const today = new Date();
      const todayDate = today.getDate();
      const currentYear = today.getFullYear();
      const currentMonthIndex = today.getMonth();

      const [newHabit, setNewHabit] = useState('');
      const [showReviewModal, setShowReviewModal] = useState(false);
      const [editingHabitId, setEditingHabitId] = useState(null);
      const [editingHabitText, setEditingHabitText] = useState('');
      const [habitToDelete, setHabitToDelete] = useState(null);

      const reviewContainerRef = useRef(null);
      const reviewMonthRefs = useRef([]);
      const longPressTimer = useRef(null);

      const months = Array.from({ length: 12 }, (_, i) => new Date(currentYear, i, 1));

      useEffect(() => {
        if (showReviewModal) {
          const timer = setTimeout(() => {
            const el = reviewMonthRefs.current[currentMonthIndex];
            const container = reviewContainerRef.current;
            if (el && container) {
              container.scrollTop = el.offsetTop - (container.clientHeight / 2) + (el.clientHeight / 2);
            }
          }, 50);
          return () => clearTimeout(timer);
        }
      }, [showReviewModal, currentMonthIndex]);

      const submitAddHabit = () => {
        if (newHabit.trim()) {
          setHabits([{ id: Date.now().toString(), name: newHabit.trim(), records: {} }, ...habits]);
          setNewHabit('');
        }
      };

      const addHabit = (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          e.stopPropagation();
          submitAddHabit();
        }
      };

      const toggleHabitDay = (habitId, day, year = currentYear, month = currentMonthIndex) => {
        const dateKey = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        setHabits(habits.map(h => {
          if (h.id === habitId) {
            const updated = { ...h.records };
            if (updated[dateKey] || updated[day]) {
              delete updated[dateKey];
              delete updated[day];
            } else {
              updated[dateKey] = true;
              updated[day] = true;
            }
            return { ...h, records: updated };
          }
          return h;
        }));
      };

      const isHabitDoneOnDay = (habit, day, year, month) => {
        const dateKey = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        return !!(habit.records[dateKey] || (month === currentMonthIndex && year === currentYear && habit.records[day]));
      };

      const updateHabitName = (habitId, name) => {
        setHabits(habits.map(h => h.id === habitId ? { ...h, name } : h));
      };

      const deleteHabit = (habitId) => {
        setHabits(habits.filter(h => h.id !== habitId));
      };

      const handleFinishHabitEdit = (habitId) => {
        const trimmed = editingHabitText.trim();
        if (!trimmed) {
          deleteHabit(habitId);
        } else {
          updateHabitName(habitId, trimmed);
        }
        setEditingHabitId(null);
      };

      const handleHabitPointerDown = (habit) => {
        longPressTimer.current = setTimeout(() => {
          if (navigator.vibrate) navigator.vibrate(50);
          setHabitToDelete(habit);
        }, 500);
      };

      const handleHabitPointerUp = () => {
        if (longPressTimer.current) {
          clearTimeout(longPressTimer.current);
          longPressTimer.current = null;
        }
      };

      const completedTodayCount = habits.filter(h => isHabitDoneOnDay(h, todayDate, currentYear, currentMonthIndex)).length;
      const totalHabitsCount = habits.length;
      const habitPercent = totalHabitsCount > 0 ? Math.round((completedTodayCount / totalHabitsCount) * 100) : 0;

      const getDaysInMonth = (year, month) => {
        const date = new Date(year, month, 1);
        const days = [];
        for (let i = 0; i < date.getDay(); i++) days.push(null);
        while (date.getMonth() === month) { days.push(new Date(date)); date.setDate(date.getDate() + 1); }
        return days;
      };

      return (
        <div className="h-full bg-gray-50 overflow-y-auto content-bottom-space">
          <div className="w-full px-4 py-4 bg-white border-b border-gray-100 flex items-center justify-between sticky top-0 z-30 shrink-0">
            <span className="text-xs font-bold text-gray-400">{today.getMonth() + 1}/{todayDate}</span>
            <div className="flex items-center gap-1.5">
              <span className="text-[10px] font-semibold text-gray-400">{habitPercent}%</span>
              <div className="w-16 bg-gray-100 h-1.5 rounded-full overflow-hidden">
                <div className="h-full transition-all duration-500 rounded-full" style={{ width: `${habitPercent}%`, backgroundColor: themeColor }} />
              </div>
              <button
                onClick={() => setShowReviewModal(true)}
                className="text-[11px] font-bold underline ml-1 cursor-pointer transition-opacity hover:opacity-80"
                style={{ color: themeColor }}
              >
                review
              </button>
            </div>
          </div>

          <div className="p-4 pb-40">
            <div className="flex items-center border border-gray-200 bg-white mb-3">
              <input
                type="text"
                placeholder="+ new"
                value={newHabit}
                onChange={(e) => setNewHabit(e.target.value)}
                onKeyDown={addHabit}
                className="w-full bg-transparent px-3 py-2 text-sm outline-none"
              />
              <button
                type="button"
                onClick={submitAddHabit}
                className="px-3 py-2 text-lg font-bold text-gray-500 hover:text-black transition-colors shrink-0"
                title="새 해빗 추가"
              >
                +
              </button>
            </div>

            <div className="bg-white p-2 border border-gray-200 mb-4 rounded-none">
              <div className="flex flex-col gap-0.5">
                {habits.length === 0 && <p className="text-xs text-gray-400 py-1">등록된 습관이 없습니다.</p>}
                {habits.map(h => {
                  const isChecked = isHabitDoneOnDay(h, todayDate, currentYear, currentMonthIndex);
                  return (
                    <div
                      key={h.id}
                      onClick={() => toggleHabitDay(h.id, todayDate)}
                      onPointerDown={() => handleHabitPointerDown(h)}
                      onPointerUp={handleHabitPointerUp}
                      onPointerCancel={handleHabitPointerUp}
                      className="flex items-center justify-between py-1 px-2 bg-gray-50 hover:bg-gray-100 cursor-pointer transition-colors leading-tight rounded-none select-none"
                    >
                      <span className={`text-xs font-semibold ${isChecked ? 'line-through text-gray-400' : 'text-gray-800'}`}>{h.name}</span>
                      <div className={`w-4 h-4 rounded-none flex items-center justify-center transition-all ${isChecked ? 'text-white' : 'border border-gray-300 bg-white'}`} style={{ backgroundColor: isChecked ? themeColor : undefined }} />
                    </div>
                  );
                })}
              </div>
            </div>

            <div className="grid grid-cols-2 gap-3">
              {habits.map(habit => {
                const daysInCurrMonth = new Date(currentYear, currentMonthIndex + 1, 0).getDate();
                const firstDayOff = new Date(currentYear, currentMonthIndex, 1).getDay();

                return (
                  <div
                    key={habit.id}
                    onPointerDown={() => handleHabitPointerDown(habit)}
                    onPointerUp={handleHabitPointerUp}
                    onPointerCancel={handleHabitPointerUp}
                    className="bg-white p-3 border border-gray-200 rounded-none flex flex-col justify-between select-none"
                  >
                    {editingHabitId === habit.id ? (
                      <input
                        type="text"
                        autoFocus
                        value={editingHabitText}
                        onChange={(e) => setEditingHabitText(e.target.value)}
                        onKeyDown={(e) => {
                          if (e.key === 'Enter') handleFinishHabitEdit(habit.id);
                        }}
                        onBlur={() => handleFinishHabitEdit(habit.id)}
                        className="font-bold text-xs text-gray-800 mb-2 outline-none bg-gray-50 border border-gray-300 px-1 py-0.5 rounded w-full"
                      />
                    ) : (
                      <input
                        type="text"
                        value={habit.name}
                        onDoubleClick={() => {
                          setEditingHabitId(habit.id);
                          setEditingHabitText(habit.name);
                        }}
                        onChange={(e) => updateHabitName(habit.id, e.target.value)}
                        className="font-bold text-xs text-gray-800 mb-2 outline-none bg-transparent w-full cursor-pointer"
                      />
                    )}
                    <div className="grid grid-cols-7 gap-1 mt-auto">
                      {Array.from({ length: firstDayOff }).map((_, i) => (
                        <div key={`empty-${i}`} className="w-full h-3" />
                      ))}
                      {Array.from({ length: daysInCurrMonth }, (_, i) => i + 1).map(day => (
                        <button
                          key={day}
                          onClick={(e) => {
                            e.stopPropagation();
                            toggleHabitDay(habit.id, day);
                          }}
                          className={`w-full h-3 rounded-none transition-colors ${day === todayDate ? 'ring-1 ring-offset-1 ring-black/40' : ''}`}
                          style={{ backgroundColor: isHabitDoneOnDay(habit, day, currentYear, currentMonthIndex) ? themeColor : '#f1f5f9' }}
                          title={`${day}일`}
                        />
                      ))}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>

          {habitToDelete && (
            <div className="fixed inset-0 bg-black/40 flex justify-center items-center z-50 p-4" onClick={() => setHabitToDelete(null)}>
              <div className="bg-white p-6 rounded-2xl shadow-xl w-72 flex flex-col items-center gap-4 text-center" onClick={e => e.stopPropagation()}>
                <h3 className="font-extrabold text-gray-800 text-base">해빗을 삭제하시겠습니까?</h3>
                <p className="text-xs text-gray-500 font-medium truncate w-full px-2">"{habitToDelete.name}"</p>
                <div className="flex gap-3 w-full mt-2">
                  <button
                    onClick={() => setHabitToDelete(null)}
                    className="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 text-xs font-bold py-2.5 rounded-xl transition-colors"
                  >
                    아니오
                  </button>
                  <button
                    onClick={() => {
                      deleteHabit(habitToDelete.id);
                      setHabitToDelete(null);
                    }}
                    className="flex-1 bg-red-500 hover:bg-red-600 text-white text-xs font-bold py-2.5 rounded-xl transition-colors"
                  >
                    예
                  </button>
                </div>
              </div>
            </div>
          )}

          {showReviewModal && (
            <div className="fixed inset-0 bg-black/40 flex justify-center items-center z-50 p-4" onClick={() => setShowReviewModal(false)}>
              <div className="bg-white p-5 rounded-2xl shadow-xl w-80 max-h-[85vh] h-[580px] flex flex-col gap-3" onClick={e => e.stopPropagation()}>
                <div className="flex justify-end items-center border-b border-gray-100 pb-2 shrink-0">
                  <button onClick={() => setShowReviewModal(false)} className="text-gray-400 hover:text-black text-xs font-bold p-1">✕</button>
                </div>

                <div ref={reviewContainerRef} className="flex-1 overflow-y-auto pr-1 flex flex-col gap-6">
                  {months.map((mDate, mIdx) => {
                    const mYear = mDate.getFullYear();
                    const mMonth = mDate.getMonth();
                    const mDays = getDaysInMonth(mYear, mMonth);
                    const isCurrMonth = mMonth === currentMonthIndex && mYear === currentYear;

                    return (
                      <div key={mIdx} ref={el => reviewMonthRefs.current[mIdx] = el} className="flex flex-col">
                        <h4 className="font-extrabold text-sm mb-2 pl-0.5" style={{ color: isCurrMonth ? themeColor : '#1f2937' }}>
                          {mMonth + 1}월
                        </h4>

                        <div className="grid grid-cols-7 text-center text-[10px] font-bold text-gray-400 mb-1.5">
                          <div className="text-red-400">일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div className="text-blue-400">토</div>
                        </div>

                        <div className="grid grid-cols-7 gap-1.5">
                          {mDays.map((dayDate, dayIdx) => {
                            if (!dayDate) return <div key={`empty-${dayIdx}`} className="h-9" />;

                            const dNum = dayDate.getDate();
                            const totalHabits = habits.length;
                            const doneCount = habits.filter(h => isHabitDoneOnDay(h, dNum, mYear, mMonth)).length;
                            const rate = totalHabits > 0 ? doneCount / totalHabits : 0;
                            const isTodayDate = isCurrMonth && dNum === todayDate;

                            const spectrumOpacity = rate > 0 ? 0.12 + Math.pow(rate, 0.85) * 0.88 : 1;

                            return (
                              <div
                                key={dNum}
                                className={`h-9 rounded-lg flex flex-col items-center justify-center relative transition-all ${isTodayDate ? 'ring-2 ring-black/70 font-bold' : ''}`}
                                style={{
                                  backgroundColor: rate > 0 ? themeColor : '#f1f5f9',
                                  opacity: spectrumOpacity
                                }}
                                title={`${mMonth + 1}월 ${dNum}일: ${Math.round(rate * 100)}% (${doneCount}/${totalHabits})`}
                              >
                                <span className={`text-[10px] ${rate > 0.4 ? 'text-white font-bold' : 'text-gray-700 font-semibold'}`}>
                                  {dNum}
                                </span>
                                {rate > 0 && (
                                  <span className={`text-[8px] ${rate > 0.4 ? 'text-white/90' : 'text-gray-600 font-medium'}`}>
                                    {Math.round(rate * 100)}%
                                  </span>
                                )}
                              </div>
                            );
                          })}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // --- 4. 설정 화면 컴포넌트 ---
    function SettingsScreen({
      currentAccount,
      accounts,
      onSwitchAccount,
      onDeleteAccount,
      onResetAccount,
      themeColor, setThemeColor,
      userName, setUserName,
      profileImage, setProfileImage,
      savedColors, setSavedColors,
      startHour, setStartHour,
      endHour, setEndHour,
      onBack
    }) {
      const [customHex, setCustomHex] = useState('');
      const [hexError, setHexError] = useState('');
      const [showAccountModal, setShowAccountModal] = useState(false);
      const [showResetModal, setShowResetModal] = useState(false);
      const [newAccountInput, setNewAccountInput] = useState('');
      const [accountToDelete, setAccountToDelete] = useState(null);
      const [colorToDelete, setColorToDelete] = useState(null);

      const fileInputRef = useRef(null);
      const backupFileInputRef = useRef(null);
      const colorPressTimer = useRef(null);

      // 데이터 백업 (내보내기)
      const handleExportData = () => {
        const backupData = {};
        for (let i = 0; i < window.localStorage.length; i++) {
          const key = window.localStorage.key(i);
          if (key && key.startsWith('app_')) {
            backupData[key] = window.localStorage.getItem(key);
          }
        }
        const blob = new Blob([JSON.stringify(backupData, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `scheduler_backup_${new Date().toISOString().slice(0, 10)}.json`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
      };

      // 데이터 복구 (불러오기)
      const handleImportData = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const data = JSON.parse(event.target.result);
            if (data && typeof data === 'object') {
              Object.keys(data).forEach(key => {
                if (key.startsWith('app_')) {
                  window.localStorage.setItem(key, data[key]);
                }
              });
              alert('데이터 복구가 완료되었습니다.');
              window.location.reload();
            } else {
              alert('올바르지 않은 백업 파일 형식입니다.');
            }
          } catch (err) {
            alert('파일을 읽는 중 오류가 발생했습니다.');
          }
        };
        reader.readAsText(file);
      };

      const handleImageUpload = (e) => {
