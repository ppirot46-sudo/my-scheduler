        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => setProfileImage(reader.result);
          reader.readAsDataURL(file);
        }
      };

      const handleAddColor = () => {
        const hexRegex = /^#([0-9A-F]{3}){1,2}$/i;
        if (hexRegex.test(customHex)) {
          const formatted = customHex.toUpperCase();
          if (!savedColors.includes(formatted)) {
            setSavedColors([...savedColors, formatted]);
          }
          setThemeColor(formatted);
          setCustomHex('');
          setHexError('');
        } else {
          setHexError('올바른 코드 입력 (예: #000000)');
        }
      };

      const handleColorPointerDown = (c) => {
        colorPressTimer.current = setTimeout(() => {
          if (savedColors.length > 1) {
            setColorToDelete(c);
          }
        }, 500);
      };

      const handleColorPointerUp = () => {
        if (colorPressTimer.current) {
          clearTimeout(colorPressTimer.current);
          colorPressTimer.current = null;
        }
      };

      const confirmDeleteColor = () => {
        if (colorToDelete) {
          const updated = savedColors.filter(c => c !== colorToDelete);
          setSavedColors(updated);
          if (themeColor === colorToDelete) {
            setThemeColor(updated[0] || '#000000');
          }
          setColorToDelete(null);
        }
      };

      const handleCreateAndSwitchAccount = () => {
        if (!newAccountInput.trim()) return;
        const name = newAccountInput.trim();
        onSwitchAccount(name);
        setNewAccountInput('');
        setShowAccountModal(false);
      };

      const confirmDeleteAccount = () => {
        if (accountToDelete) {
          onDeleteAccount(accountToDelete);
          setAccountToDelete(null);
        }
      };

      return (
        <div className="h-full bg-gray-50 p-4 overflow-y-auto content-bottom-space">
          <div className="flex items-center justify-between mb-4 pt-1">
            <button onClick={onBack} className="p-1.5 rounded-full text-gray-600 hover:bg-gray-200 transition-colors">
              <ChevronLeftIcon size={20} />
            </button>
            <h2 className="text-base font-extrabold text-gray-800">설정</h2>
            <div className="w-6"></div>
          </div>

          <div className="bg-white p-5 rounded-2xl border border-gray-100 shadow-sm mb-4 flex flex-col items-center">
            <div
              onClick={() => fileInputRef.current?.click()}
              className="w-20 h-20 rounded-full bg-gray-100 flex items-center justify-center cursor-pointer relative overflow-hidden mb-3 shadow-sm"
              style={{ backgroundColor: profileImage ? 'transparent' : (themeColor || '#f3f4f6') }}
            >
              {profileImage && (
                <img src={profileImage} alt="Profile" className="w-full h-full object-cover" />
              )}
            </div>
            <input ref={fileInputRef} type="file" accept="image/*" onChange={handleImageUpload} className="hidden" />

            <input
              type="text"
              value={userName}
              onChange={(e) => setUserName(e.target.value)}
              placeholder="이름 입력"
              className="text-center font-extrabold text-base text-gray-800 bg-transparent border-b border-gray-200 outline-none pb-1 w-44 focus:border-black"
            />
          </div>

          <div className="bg-white p-4 rounded-2xl border border-gray-100 shadow-sm mb-4">
            <label className="block text-xs font-bold text-gray-500 mb-3">work time</label>
            <div className="flex items-center gap-2">
              <select
                value={startHour}
                onChange={(e) => setStartHour(Number(e.target.value))}
                className="bg-gray-50 border border-gray-200 rounded px-2 py-1 text-xs font-bold w-16 text-center outline-none"
              >
                {Array.from({ length: 24 }, (_, i) => (
                  <option key={i} value={i}>{i}시</option>
                ))}
              </select>
              <span className="text-gray-400 font-bold">~</span>
              <select
                value={endHour}
                onChange={(e) => setEndHour(Number(e.target.value))}
                className="bg-gray-50 border border-gray-200 rounded px-2 py-1 text-xs font-bold w-20 text-center outline-none"
              >
                {Array.from({ length: 28 }, (_, i) => i + 1).map(h => (
                  <option key={h} value={h}>{h > 24 ? `익일 ${h-24}시` : `${h}시`}</option>
                ))}
              </select>
            </div>
          </div>

          <div className="bg-white p-4 rounded-2xl border border-gray-100 shadow-sm mb-4">
            <div className="flex justify-between items-center mb-2">
              <label className="text-xs font-bold text-gray-500">테마 색상 목록</label>
              <span className="text-[10px] text-gray-400">길게 눌러 삭제</span>
            </div>

            <div className="flex flex-wrap gap-2.5 mb-4">
              {savedColors.map(c => (
                <button
                  key={c}
                  onClick={() => setThemeColor(c)}
                  onPointerDown={() => handleColorPointerDown(c)}
                  onPointerUp={handleColorPointerUp}
                  onPointerLeave={handleColorPointerUp}
                  className={`w-7 h-7 rounded-full transition-transform ${themeColor === c ? 'ring-2 ring-offset-2 ring-black scale-105' : ''}`}
                  style={{ backgroundColor: c }}
                />
              ))}
            </div>

            <div className="border-t border-gray-100 pt-3">
              <label className="block text-[11px] font-semibold text-gray-400 mb-1.5">직접 색상 코드 추가 (HEX)</label>
              <div className="flex gap-2 items-center">
                <input
                  type="text"
                  value={customHex}
                  onChange={(e) => setCustomHex(e.target.value)}
                  placeholder="#000000"
                  className="flex-1 bg-gray-50 border border-gray-200 rounded-lg px-3 py-1.5 text-xs outline-none font-mono"
                />
                <button
                  onClick={handleAddColor}
                  className="px-3 py-1.5 rounded-lg text-xs font-bold text-white shrink-0 bg-black"
                >
                  추가
                </button>
              </div>
              {hexError && <p className="text-[10px] text-red-500 mt-1">{hexError}</p>}
            </div>
          </div>

          <div className="flex gap-2 mb-4">
            <button
              onClick={() => setShowAccountModal(true)}
              className="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 text-xs font-bold py-3 rounded-xl transition-colors shadow-sm"
            >
              계정 전환
            </button>
            <button
              onClick={() => setShowResetModal(true)}
              className="flex-1 bg-red-50 hover:bg-red-100 text-red-500 text-xs font-bold py-3 rounded-xl transition-colors shadow-sm"
            >
              초기화
            </button>
          </div>

          {/* 데이터 백업 및 복구 버튼 영역 (가장 아래 위치) */}
          <div className="bg-white p-4 rounded-2xl border border-gray-100 shadow-sm mb-4 pb-40">
            <label className="block text-xs font-bold text-gray-500 mb-1">데이터 백업 및 복구</label>
            <p className="text-[10px] text-gray-400 mb-3">앱 재설치 전에 데이터를 파일로 저장하거나 복구합니다.</p>
            <div className="flex gap-2">
              <button
                onClick={handleExportData}
                className="flex-1 bg-gray-50 hover:bg-gray-100 text-gray-800 border border-gray-200 text-xs font-bold py-2.5 rounded-xl transition-colors shadow-sm"
              >
                백업 (내보내기)
              </button>
              <button
                onClick={() => backupFileInputRef.current?.click()}
                className="flex-1 bg-gray-50 hover:bg-gray-100 text-gray-800 border border-gray-200 text-xs font-bold py-2.5 rounded-xl transition-colors shadow-sm"
              >
                복구 (불러오기)
              </button>
            </div>
            <input
              ref={backupFileInputRef}
              type="file"
              accept=".json"
              onChange={handleImportData}
              className="hidden"
            />
          </div>

          {colorToDelete && (
            <div className="fixed inset-0 bg-black/40 flex justify-center items-center z-50 p-4" onClick={() => setColorToDelete(null)}>
              <div className="bg-white p-6 rounded-2xl shadow-xl w-72 flex flex-col items-center gap-4 text-center" onClick={e => e.stopPropagation()}>
                <h3 className="font-extrabold text-gray-800 text-base">색상을 삭제하시겠습니까?</h3>
                <div className="w-8 h-8 rounded-full border shadow-sm" style={{ backgroundColor: colorToDelete }} />
                <div className="flex gap-3 w-full mt-2">
                  <button
                    onClick={() => setColorToDelete(null)}
                    className="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 text-xs font-bold py-2.5 rounded-xl transition-colors"
                  >
                    아니오
                  </button>
                  <button
                    onClick={confirmDeleteColor}
                    className="flex-1 bg-red-500 hover:bg-red-600 text-white text-xs font-bold py-2.5 rounded-xl transition-colors"
                  >
                    예
                  </button>
                </div>
              </div>
            </div>
          )}

          {showAccountModal && (
            <div className="fixed inset-0 bg-black/40 flex justify-center items-center z-50 p-4" onClick={() => setShowAccountModal(false)}>
              <div className="bg-white p-5 rounded-2xl shadow-xl w-80 flex flex-col gap-4" onClick={e => e.stopPropagation()}>
                <div className="flex justify-between items-center border-b border-gray-100 pb-2">
                  <h3 className="font-extrabold text-gray-800 text-base">계정 전환 / 추가</h3>
                  <button onClick={() => setShowAccountModal(false)} className="text-gray-400 hover:text-black text-xs font-bold">✕</button>
                </div>

                <div className="flex flex-col gap-1.5 max-h-40 overflow-y-auto">
                  <p className="text-xs font-bold text-gray-400 mb-1">기존 계정 목록</p>
                  {accounts.map(acc => (
                    <div
                      key={acc}
                      className={`flex items-center justify-between px-3 py-2 rounded-lg transition-colors ${
                        acc === currentAccount ? 'bg-black text-white' : 'bg-gray-50 text-gray-700 hover:bg-gray-100'
                      }`}
                    >
                      <button
                        onClick={() => { onSwitchAccount(acc); setShowAccountModal(false); }}
                        className="flex-1 text-left text-xs font-bold flex items-center justify-between mr-2"
                      >
                        <span>{acc}</span>
                        {acc === currentAccount && <span className="text-[10px] opacity-80">사용 중</span>}
                      </button>
                      {acc !== '기본 계정' && (
                        <button
                          onClick={(e) => {
                            e.stopPropagation();
                            setAccountToDelete(acc);
                          }}
                          className={`text-xs px-1.5 py-0.5 rounded transition-colors ${
                            acc === currentAccount ? 'text-gray-300 hover:text-white' : 'text-gray-400 hover:text-red-500'
                          }`}
                          title="계정 삭제"
                        >
                          ✕
                        </button>
                      )}
                    </div>
                  ))}
                </div>

                <div className="border-t border-gray-100 pt-3">
                  <p className="text-xs font-bold text-gray-400 mb-2">새 계정 생성</p>
                  <div className="flex gap-2">
                    <input
                      type="text"
                      placeholder="계정 이름"
                      value={newAccountInput}
                      onChange={e => setNewAccountInput(e.target.value)}
                      className="flex-1 bg-gray-50 border border-gray-200 rounded-lg px-3 py-1.5 text-xs outline-none"
                    />
                    <button
                      onClick={handleCreateAndSwitchAccount}
                      className="bg-black text-white text-xs font-bold px-3 py-1.5 rounded-lg shrink-0"
                    >
                      생성 & 전환
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {accountToDelete && (
            <div className="fixed inset-0 bg-black/40 flex justify-center items-center z-50 p-4" onClick={() => setAccountToDelete(null)}>
              <div className="bg-white p-6 rounded-2xl shadow-xl w-72 flex flex-col items-center gap-4 text-center" onClick={e => e.stopPropagation()}>
                <h3 className="font-extrabold text-gray-800 text-base">삭제하시겠습니까?</h3>
                <p className="text-xs text-gray-500 leading-relaxed">
                  <span className="font-bold text-gray-800">{accountToDelete}</span> 계정과 포함된 모든 데이터가 완전히 삭제됩니다.
                </p>
                <div className="flex gap-3 w-full mt-2">
                  <button
                    onClick={() => setAccountToDelete(null)}
                    className="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 text-xs font-bold py-2.5 rounded-xl transition-colors"
                  >
                    아니오
                  </button>
                  <button
                    onClick={confirmDeleteAccount}
                    className="flex-1 bg-red-500 hover:bg-red-600 text-white text-xs font-bold py-2.5 rounded-xl transition-colors"
                  >
                    예
                  </button>
                </div>
              </div>
            </div>
          )}

          {showResetModal && (
            <div className="fixed inset-0 bg-black/40 flex justify-center items-center z-50 p-4" onClick={() => setShowResetModal(false)}>
              <div className="bg-white p-6 rounded-2xl shadow-xl w-72 flex flex-col items-center gap-4 text-center" onClick={e => e.stopPropagation()}>
                <h3 className="font-extrabold text-gray-800 text-base">진짜 초기화하시겠습니까?</h3>
                <p className="text-xs text-gray-500 leading-relaxed">
                  현재 접속 중인 계정(<span className="font-bold text-gray-800">{currentAccount}</span>)의 모든 할 일, 달력, 해빗 데이터가 완전히 삭제됩니다.
                </p>
                <div className="flex gap-3 w-full mt-2">
                  <button
                    onClick={() => setShowResetModal(false)}
                    className="flex-1 bg-gray-100 hover:bg-gray-200 text-gray-700 text-xs font-bold py-2.5 rounded-xl transition-colors"
                  >
                    아니오
                  </button>
                  <button
                    onClick={() => { onResetAccount(); setShowResetModal(false); }}
                    className="flex-1 bg-red-500 hover:bg-red-600 text-white text-xs font-bold py-2.5 rounded-xl transition-colors"
                  >
                    예
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // --- 계정 컨테이너 컴포넌트 ---
    function AccountContainer({
      currentAccount,
      accounts,
      setAccounts,
      setCurrentAccount,
      onResetAccount
    }) {
      const [view, setView] = useState('daily');
      const [calendarClickToken, setCalendarClickToken] = useState(0);

      const [themeColor, setThemeColor] = useAccountLocalStorage(currentAccount, 'themeColor', '#000000');
      const [savedColors, setSavedColors] = useAccountLocalStorage(currentAccount, 'savedColors', ['#000000']);
      const [userName, setUserName] = useAccountLocalStorage(currentAccount, 'userName', currentAccount);
      const [profileImage, setProfileImage] = useAccountLocalStorage(currentAccount, 'profileImage', null);

      const [startHour, setStartHour] = useAccountLocalStorage(currentAccount, 'startHour', 8);
      const [endHour, setEndHour] = useAccountLocalStorage(currentAccount, 'endHour', 24);

      const [categories, setCategories] = useAccountLocalStorage(currentAccount, 'categories', []);
      const [dailyTasks, setDailyTasks] = useAccountLocalStorage(currentAccount, 'dailyTasks', {});
      const [delayedTasks, setDelayedTasks] = useAccountLocalStorage(currentAccount, 'delayedTasks', []);
      const [listupTasks, setListupTasks] = useAccountLocalStorage(currentAccount, 'listupTasks', []);
      const [calendarEvents, setCalendarEvents] = useAccountLocalStorage(currentAccount, 'calendarEvents', {});
      const [habits, setHabits] = useAccountLocalStorage(currentAccount, 'habits', []);

      const [selectedDateObj, setSelectedDateObj] = useState(new Date());
      const [activeTimes, setActiveTimes] = useState({});

      const handleSwitchAccount = (targetAccount) => {
        if (!accounts.includes(targetAccount)) {
          setAccounts([...accounts, targetAccount]);
        }
        setCurrentAccount(targetAccount);
      };

      const handleDeleteAccount = (targetAccount) => {
        const updatedAccounts = accounts.filter(acc => acc !== targetAccount);
        setAccounts(updatedAccounts);

        const prefix = `app_${targetAccount}__`;
        const keysToRemove = [];
        for (let i = 0; i < window.localStorage.length; i++) {
          const key = window.localStorage.key(i);
          if (key && key.startsWith(prefix)) {
            keysToRemove.push(key);
          }
        }
        keysToRemove.forEach(k => window.localStorage.removeItem(k));

        if (currentAccount === targetAccount) {
          setCurrentAccount('기본 계정');
        }
      };

      const handleCalendarTabClick = () => {
        if (view === 'calendar') {
          setCalendarClickToken(prev => prev + 1);
        } else {
          setView('calendar');
        }
      };

      return (
        <div className="flex flex-col h-full relative">
          <div className="flex-1 overflow-hidden">
            {view === 'daily' && (
              <DailyScheduler
                themeColor={themeColor}
                dailyTasks={dailyTasks}
                setDailyTasks={setDailyTasks}
                delayedTasks={delayedTasks}
                setDelayedTasks={setDelayedTasks}
                listupTasks={listupTasks}
                setListupTasks={setListupTasks}
                onOpenSettings={() => setView('settings')}
                startHour={startHour}
                endHour={endHour}
                selectedDateObj={selectedDateObj}
                setSelectedDateObj={setSelectedDateObj}
                activeTimes={activeTimes}
                setActiveTimes={setActiveTimes}
              />
            )}
            {view === 'calendar' && (
              <CalendarScheduler
                themeColor={themeColor}
                categories={categories}
                setCategories={setCategories}
                calendarEvents={calendarEvents}
                setCalendarEvents={setCalendarEvents}
                savedColors={savedColors}
                calendarClickToken={calendarClickToken}
              />
            )}
            {view === 'habit' && (
              <HabitTracker
                themeColor={themeColor}
                habits={habits}
                setHabits={setHabits}
              />
            )}
            {view === 'settings' && (
              <SettingsScreen
                currentAccount={currentAccount}
                accounts={accounts}
                onSwitchAccount={handleSwitchAccount}
                onDeleteAccount={handleDeleteAccount}
                onResetAccount={onResetAccount}
                themeColor={themeColor}
                setThemeColor={setThemeColor}
                userName={userName}
                setUserName={setUserName}
                profileImage={profileImage}
                setProfileImage={setProfileImage}
                savedColors={savedColors}
                setSavedColors={setSavedColors}
                startHour={startHour}
                setStartHour={setStartHour}
                endHour={endHour}
                setEndHour={setEndHour}
                onBack={() => setView('daily')}
              />
            )}
          </div>

          {/* 하단 네비게이션 탭 */}
          <div className="fixed bottom-0 left-0 right-0 h-[calc(3.5rem+env(safe-area-inset-bottom,0px))] bg-white/95 backdrop-blur border-t border-gray-100 flex items-center justify-around z-50 pb-safe pt-1">
            <button onClick={() => setView('daily')} className={`flex flex-col items-center gap-1 w-16 ${view === 'daily' ? 'text-black font-bold' : 'text-gray-400'}`} style={{ color: view === 'daily' ? themeColor : undefined }}>
              <ListTodoIcon />
              <span className="text-[10px] font-bold">일간</span>
            </button>
            <button onClick={handleCalendarTabClick} className={`flex flex-col items-center gap-1 w-16 ${view === 'calendar' ? 'text-black font-bold' : 'text-gray-400'}`} style={{ color: view === 'calendar' ? themeColor : undefined }}>
              <CalendarIcon />
              <span className="text-[10px] font-bold">달력</span>
            </button>
            <button onClick={() => setView('habit')} className={`flex flex-col items-center gap-1 w-16 ${view === 'habit' ? 'text-black font-bold' : 'text-gray-400'}`} style={{ color: view === 'habit' ? themeColor : undefined }}>
              <CircleIcon />
              <span className="text-[10px] font-bold">해빗</span>
            </button>
          </div>
        </div>
      );
    }

    // --- 최상위 App 컴포넌트 ---
    function App() {
      const [currentAccount, setCurrentAccount] = useLocalStorage('app_currentAccount', '기본 계정');
      const [accounts, setAccounts] = useLocalStorage('app_accountsList', ['기본 계정']);
      const [resetToken, setResetToken] = useState(0);

      const handleResetCurrentAccount = () => {
        const prefix = `app_${currentAccount}__`;
        const keysToRemove = [];

        for (let i = 0; i < window.localStorage.length; i++) {
          const key = window.localStorage.key(i);
          if (key && key.startsWith(prefix)) {
            keysToRemove.push(key);
          }
        }

        if (currentAccount === '기본 계정') {
          keysToRemove.push('app_dailyTasks', 'app_calendarEvents', 'app_habits', 'app_delayedTasks', 'app_listupTasks', 'app_userName', 'app_profileImage', 'app_themeColor');
        }

        keysToRemove.forEach(k => window.localStorage.removeItem(k));
        setResetToken(prev => prev + 1);
      };

      return (
        <AccountContainer
          key={`${currentAccount}_${resetToken}`}
          currentAccount={currentAccount}
          accounts={accounts}
          setAccounts={setAccounts}
          setCurrentAccount={setCurrentAccount}
          onResetAccount={handleResetCurrentAccount}
        />
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
